<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>レビュー履歴</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main class="container">
    <h1>レビュー履歴</h1>
    <p><a href="{{ url_for('index') }}">← ダッシュボードに戻る</a></p>
    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>日時</th>
            <th>問題</th>
            <th>評価</th>
            <th>正誤</th>
          </tr>
        </thead>
        <tbody>
          {% for row in rows %}
          <tr>
            <td>{{ row['reviewed_at'] }}</td>
            <td>{{ row['question'] }}</td>
            <td>{{ row['rating'] }}</td>
            <td>{{ '正解' if row['correct'] else '不正解' }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
